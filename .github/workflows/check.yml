name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vp check
      - run: npx -p typescript@6 tsc -p tsconfig.json --noEmit
      - run: npx -p typescript@6 tsc -p worker/tsconfig.json --noEmit
      # The build also checks every translation against the English (src/i18n-check.ts, src/content.ts).
      - run: npx vp build
