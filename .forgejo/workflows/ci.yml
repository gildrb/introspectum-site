name: Check & deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vp check
      - run: npx -p typescript@6 tsc -p tsconfig.json --noEmit
      - run: npx -p typescript@6 tsc -p worker/tsconfig.json --noEmit
      # The build also checks every translation against the English (src/i18n-check.ts, src/content.ts).
      - run: npx vp build
      # A push to main that passes every check goes live at introspectum.eu, from the build above.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
